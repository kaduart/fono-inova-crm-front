<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 👇 Nome da clínica na aba -->
    <title>Fono Inova - Gestão Clínica</title>

    <!-- 👇 Logo da clínica como favicon -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" />
    <link rel="icon" type="image/png" href="/images/favicon-64.png" />
    <!-- Se for .ico:
    <link rel="icon" type="image/x-icon" href="/logo-clinica.ico" />
    -->
    <!-- Tema escuro antes da primeira pintura (evita piscar branco). Ver ThemeModeContext. -->
    <script>
      try {
        var t = localStorage.getItem('fono-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
